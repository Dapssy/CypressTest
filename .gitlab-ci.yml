image: cypress/included:13.13.0

stages:
  - test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - node_modules
    - cache/Cypress

cypress:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm install mocha-junit-reporter --save-dev
    - mkdir -p results
    - npx cypress verify
    - npx cypress run --reporter mocha-junit-reporter --reporter-options mochaFile=results/junit.xml

  artifacts:
    when: always
    paths:
      - cypress/screenshots
      - cypress/videos
      - results
    reports:
      junit: results/junit.xml
    expire_in: 1 week