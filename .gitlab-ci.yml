stages:
  - test

variables:
  # Speeds up npm + avoids Cypress re-download when cache hits
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .cache/Cypress/

cypress:
  stage: test
  image:
    name: cypress/included:13.13.0
    entrypoint: [""]          # 👈 critical: lets GitLab run its own shell
  # Secrets configured in GitLab → Settings → CI/CD → Variables (masked + protected)
  # CYPRESS_BASE_URL, CYPRESS_API_URL, CYPRESS_API_KEY, CYPRESS_USERNAME, CYPRESS_PASSWORD
  script:
    - npm ci
    - npx cypress verify
    - npx cypress run --reporter mocha-junit-reporter
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - cypress/screenshots
      - cypress/videos
      - results
    reports:
      junit: results/*.xml