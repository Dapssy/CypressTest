stages:
  - test

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  CYPRESS_CACHE_FOLDER: "$CI_PROJECT_DIR/.cache/Cypress"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - .cache/Cypress/

cypress:
  stage: test
  image:
    name: cypress/included:13.13.0
    entrypoint: [""]
  # Required GitLab CI/CD Variables (Masked, NOT Protected unless branch is protected):
  #   CYPRESS_BASE_URL, CYPRESS_API_URL, CYPRESS_API_KEY, CYPRESS_USERNAME, CYPRESS_PASSWORD
  script:
    - npm ci
    - npx cypress verify
    # Sanity check — remove once env vars are confirmed present
    - 'echo "BASE=${CYPRESS_BASE_URL:-MISSING} API=${CYPRESS_API_URL:-MISSING}"'
    - npx cypress run
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - cypress/screenshots
      - cypress/videos
      - reports
    reports:
      junit: reports/*.xml